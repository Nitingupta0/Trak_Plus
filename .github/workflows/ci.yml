# TrakPlus — single CI workflow.
#
# ONE workflow = ONE action in the GitHub UI. All checks live here as jobs.
# Every command below was verified locally before committing (ruff, alembic,
# pytest, tsc, eslint, vitest, hadolint, pip-audit, npm audit, terraform,
# docker builds + smoke tests, image sizes).
#
# Action versions pinned to the Node 24 line (GitHub removed Node 20 support
# Sept 2026): checkout v7, setup-python v7, setup-node v7, upload-artifact v7,
# buildx v4, build-push v7, setup-terraform v4, gitleaks v3.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend · ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Ruff check (E, F, I, B, UP)
        run: ruff check . --output-format=github
      - name: Ruff format check
        run: ruff format --check .

  backend-migrations:
    name: Backend · alembic chain
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trakplus
          POSTGRES_PASSWORD: trakplus
          POSTGRES_DB: trakplus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trakplus -d trakplus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://trakplus:trakplus@localhost:5432/trakplus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade to base, re-upgrade
        run: alembic downgrade base && alembic upgrade head
      - name: No model/migration drift
        run: alembic check

  backend-test:
    name: Backend · pytest (coverage ≥ 80%)
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trakplus
          POSTGRES_PASSWORD: trakplus
          POSTGRES_DB: trakplus
        # conftest.py defaults to host port 5433 (matches local dev).
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U trakplus -d trakplus"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest with coverage
        run: |
          python -m pytest --tb=short -q \
            --cov=app --cov=app.services \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 -x
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  backend-docker:
    name: Backend · Docker build + smoke
    runs-on: ubuntu-latest
    needs: [backend-test, backend-migrations]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: trakplus-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image size (< 300 MB)
        run: |
          M=$(( $(docker image inspect trakplus-backend:ci --format='{{.Size}}') / 1048576 ))
          echo "Image size: ${M} MB"
          [ "$M" -le 300 ] || { echo "::error::backend image ${M} MB exceeds 300 MB"; exit 1; }
      - name: Smoke test — /health returns 200
        run: |
          docker run -d --name backend-smoke -p 8000:8000 trakplus-backend:ci
          sleep 4
          docker logs backend-smoke >/dev/null 2>&1 || true
          S=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || echo 000)
          docker rm -f backend-smoke >/dev/null
          [ "$S" = "200" ] || { echo "::error::/health returned $S"; exit 1; }

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend · eslint + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend · vitest (12 component tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Single run: test failures fail the step (no `|| true` masking). The JSON
      # report is written by the json reporter (must be present for --outputFile),
      # and the same run's stdout shows the default reporter.
      - name: Run vitest with coverage
        run: |
          npx vitest run \
            --coverage.enabled \
            --coverage.reporter=json-summary \
            --coverage.reporter=text \
            --reporter=default \
            --reporter=json \
            --outputFile=test-results.json
      - name: Verify ≥ 12 tests ran
        run: |
          TOTAL=$(node -e "const r=require('./test-results.json'); console.log(r.numTotalTests)")
          echo "Total tests: $TOTAL"
          [ "$TOTAL" -ge 12 ] || { echo "::error::expected ≥12 tests, found $TOTAL"; exit 1; }
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  frontend-build:
    name: Frontend · next build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    defaults:
      run:
        working-directory: frontend
    env:
      # Inlined into client bundles at build time; the real target is set at
      # runtime via env (API_URL / NEXT_PUBLIC_API_URL) when deployed.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build (standalone)
        run: npm run build
      - name: Verify standalone server output
        run: test -f .next/standalone/server.js

  frontend-docker:
    name: Frontend · Docker build + smoke
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-docker]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: true
          tags: trakplus-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image size (< 250 MB)
        run: |
          M=$(( $(docker image inspect trakplus-frontend:ci --format='{{.Size}}') / 1048576 ))
          echo "Image size: ${M} MB"
          [ "$M" -le 250 ] || { echo "::error::frontend image ${M} MB exceeds 250 MB"; exit 1; }
      - name: Smoke test — /login serves 200
        run: |
          docker run -d --name fe-smoke -p 3000:3000 trakplus-frontend:ci
          sleep 5
          S=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || echo 000)
          docker rm -f fe-smoke >/dev/null
          [ "$S" = "200" ] || { echo "::error::/login returned $S"; exit 1; }

  # ── Infra ───────────────────────────────────────────────────────────────────
  infra:
    name: Infra · terraform (${INFRA_DIR})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra, infra/environments/staging, infra/environments/prod]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9"
      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive infra/
      - name: terraform init + validate (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false && terraform validate

  infra-modules:
    name: Infra · module structure audit
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: actions/checkout@v7
      - name: Verify 6 modules + 2 environments exist
        run: |
          for mod in network eks rds elasticache ecr iam; do
            test -f "infra/modules/$mod/main.tf" || { echo "::error::missing infra/modules/$mod/main.tf"; exit 1; }
          done
          for env in staging prod; do
            for f in main.tf backend.hcl terraform.tfvars.example; do
              test -f "infra/environments/$env/$f" || { echo "::error::missing infra/environments/$env/$f"; exit 1; }
            done
          done
          echo "Infra structure OK — modules validated below"

  # ── Security ────────────────────────────────────────────────────────────────
  security:
    name: Security · secrets + hygiene + audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No .env files committed
        run: |
          FILES=$(git ls-files '*.env' '**/.env' '.env.*' ':!*.env.example' 2>/dev/null || true)
          [ -z "$FILES" ] || { echo "::error::sensitive .env files tracked: $FILES"; exit 1; }

      - name: Required docs present
        run: |
          for f in AGENTS.md README.md .env.example docs/prod.md docs/design.md docs/todos.md docs/progress.md; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: docker-compose.yml valid
        run: docker compose config --quiet

      - name: Backend Dockerfile lint (hadolint)
        run: cat backend/Dockerfile | docker run --rm -i hadolint/hadolint hadolint - --ignore DL3013 --ignore DL3066

      - name: Frontend Dockerfile lint (hadolint)
        run: cat frontend/Dockerfile | docker run --rm -i hadolint/hadolint hadolint - --ignore DL3066

  security-audits:
    name: Security · dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: pip-audit (requirements.txt only)
        run: |
          pip install pip-audit
          # Audits the pinned requirements file, not the runner's bundled
          # pip/setuptools tooling (verified clean locally: no known CVEs).
          pip-audit -r backend/requirements.txt --strict --desc

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      - name: npm audit (all deps, critical only)
        run: npm audit --audit-level=critical
        working-directory: frontend

  # ── End-to-end (single job — compose build happens once) ────────────────────
  e2e:
    name: E2E · full stack + Playwright journey
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, backend-docker, frontend-docker]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright + chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Bring up compose stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Health probes
        run: |
          curl -sf http://localhost:8000/health | jq -e '.status == "ok"'
          curl -sf http://localhost:8000/health/ready | jq -e '.components.database.ok == true and .components.redis.ok == true'
          curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login | grep -qx 200

      - name: API contract — public + protected
        run: |
          # public
          curl -sf "http://localhost:8000/search?q=test&type=all" | jq -e '.results'
          # protected rejects unauthenticated
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/library)" = "401" ]

      - name: Auth + search + library + progress flow (live, keyless sources)
        run: |
          EMAIL="ci-$(date +%s)@test.dev"; PASS="ciTestPassword123"
          curl -sf -X POST http://localhost:8000/auth/register -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" | jq -e '.id'
          ACCESS=$(curl -sf -X POST http://localhost:8000/auth/login \
            -d "username=$EMAIL&password=$PASS" | jq -r '.access_token')
          curl -sf http://localhost:8000/auth/me -H "Authorization: Bearer $ACCESS" | jq -e --arg e "$EMAIL" '.email == $e'
          SEARCH=$(curl -sf "http://localhost:8000/search?q=naruto&type=all")
          [ "$(echo "$SEARCH" | jq '.count')" -gt 0 ] || { echo "::error::search 0 results"; exit 1; }
          SOURCE=$(echo "$SEARCH" | jq -r '.results[0].source')
          SID=$(echo "$SEARCH" | jq -r '.results[0].source_id')
          TID=$(curl -sf "http://localhost:8000/titles/$SOURCE/$SID" | jq -r '.id')
          [ "$TID" != "null" ] || { echo "::error::title upsert missing id"; exit 1; }
          EID=$(curl -sf -X POST http://localhost:8000/library -H "Authorization: Bearer $ACCESS" \
            -H 'Content-Type: application/json' \
            -d "{\"title_id\":\"$TID\",\"status\":\"watching\"}" | jq -r '.id')
          [ "$EID" != "null" ] || { echo "::error::library add failed"; exit 1; }
          curl -sf -X POST "http://localhost:8000/titles/$SOURCE/$SID/episodes/sync?media_type=anime" | jq -e '.total > 0'

      - name: Playwright full user journey
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test --reporter=github

      - name: Upload Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v --remove-orphans

  # ── Deploy: ECR push + Lightsail auto-deploy (main branch only) ─────────────
  # Requires repo secrets: AWS_DEPLOY_ROLE_ARN, ECR_BACKEND_URL, ECR_FRONTEND_URL,
  # LIGHTSAIL_DEPLOY_WEBHOOK (optional, for instant deploy). Runs after all tests pass.
  # Lightsail auto-deploy.sh polls ECR every 5 min, so deploys happen within ~5 min.

  push-images:
    name: Push images to ECR
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend-docker, frontend-docker, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:latest
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ECR_BACKEND_URL }}:${{ github.sha }}
            ${{ secrets.ECR_BACKEND_URL }}:latest
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.ECR_FRONTEND_URL }}:${{ github.sha }}
            ${{ secrets.ECR_FRONTEND_URL }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      # Lightsail auto-deploys via polling (deploy/auto-deploy.sh runs every 5 min)

  # ── EKS portfolio path (gated, for demos only) ──────────────────────────────
  # To enable: Settings → Secrets and variables → Actions → Variables →
  # New variable: EKS_DEPLOY_ENABLED=true (+ the secrets below).

  deploy-staging:
    name: Deploy staging (EKS)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.EKS_DEPLOY_ENABLED == 'true'
    needs: [push-images]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
      - name: Render manifests with image tag
        run: |
          sed -i "s|<ECR_BACKEND_URL>|${{ secrets.ECR_BACKEND_URL }}|g" k8s/*.yaml
          sed -i "s|<ECR_FRONTEND_URL>|${{ secrets.ECR_FRONTEND_URL }}|g" k8s/*.yaml
          sed -i "s|<IMAGE_TAG>|${{ github.sha }}|g" k8s/*.yaml
      - name: Deploy to staging
        run: |
          aws eks update-kubeconfig --name trakplus-staging --region ${{ secrets.AWS_REGION || 'ap-south-1' }}
          kubectl apply -f k8s/
          kubectl rollout status deployment/trakplus-backend -n trakplus --timeout=300s
          kubectl rollout status deployment/trakplus-frontend -n trakplus --timeout=300s
      - name: Smoke test staging (via ALB)
        run: |
          for i in $(seq 1 30); do
            ALB_URL=$(kubectl get ingress trakplus-ingress -n trakplus -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            [ -n "$ALB_URL" ] && break; sleep 10
          done
          [ -n "$ALB_URL" ] || { echo "::error::ALB not provisioned"; exit 1; }
          curl -sf "http://$ALB_URL/health" | jq -e '.status == "ok"'
          echo "Staging deploy verified at http://$ALB_URL"

  deploy-prod:
    name: Deploy production (EKS) — approval required
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.EKS_DEPLOY_ENABLED == 'true'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
      - name: Render manifests with image tag
        run: |
          sed -i "s|<ECR_BACKEND_URL>|${{ secrets.ECR_BACKEND_URL }}|g" k8s/*.yaml
          sed -i "s|<ECR_FRONTEND_URL>|${{ secrets.ECR_FRONTEND_URL }}|g" k8s/*.yaml
          sed -i "s|<IMAGE_TAG>|${{ github.sha }}|g" k8s/*.yaml
      - name: Deploy to production
        run: |
          aws eks update-kubeconfig --name trakplus-prod --region ${{ secrets.AWS_REGION || 'ap-south-1' }}
          kubectl apply -f k8s/
          kubectl rollout status deployment/trakplus-backend -n trakplus --timeout=300s
          kubectl rollout status deployment/trakplus-frontend -n trakplus --timeout=300s