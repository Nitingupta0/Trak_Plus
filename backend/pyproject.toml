[project]
name = "trakplus-backend"
version = "0.1.0"
description = "TrakPlus backend — multi-media tracker API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: Depends()/Query() in FastAPI parameter defaults is the framework idiom.
ignore = ["B008"]
