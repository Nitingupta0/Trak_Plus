# TrakPlus — Lightsail production compose (adds Caddy; disables host port exposure).
#
# Usage (on the Lightsail box, from the repo root):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.lightsail.yml \
#     --env-file deploy/.env.lightsail up -d --build
#
# The base docker-compose.yml provides postgres/redis/backend/frontend. This file:
#   1. adds the `caddy` service (TLS + reverse proxy),
#   2. removes the host port bindings (ports 3000/8000/5433/6379 stay internal —
#      only Caddy's 80/443 are exposed; Lightsail's firewall also enforces this),
#   3. overrides runtime env (strong DB password, prod CORS, in-container API_URL).
#
# Build-time vars (NEXT_PUBLIC_*) are passed via --env-file, matching the
# frontend Dockerfile ARGs, so the client bundle gets the right API base.

name: trakplus-lightsail

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      # Site is HTTPS-only; http://localhost/ never matches (caused false "unhealthy").
      # Hit the backend /health through Caddy over HTTPS using the real domain.
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://trakplus.lucifer07o.tech/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No host port binding on Lightsail — reachable only inside the compose network.
    ports: []
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    ports: []

  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      TMDB_API_KEY: ${TMDB_API_KEY}
      RAWG_API_KEY: ${RAWG_API_KEY}
      CORS_ORIGINS: '["https://trakplus.lucifer07o.tech"]'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      EXTERNAL_API_VERIFY_SSL: "true"
    ports: []

  frontend:
    environment:
      # Browser + server runtime: same-origin via Caddy.
      NEXT_PUBLIC_API_URL: /api
      API_URL: http://backend:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    ports: []

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
